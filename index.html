<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>حاسبة العطور الاحترافية</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#e8c070"/>

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="حاسبة العطور"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="apple-touch-startup-image" href="icon-512.png"/>

<!-- General -->
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="application-name" content="حاسبة العطور"/>
<meta name="description" content="حاسبة العطور الاحترافية — تركيبات، مزج، تكاليف، أرباح"/>

<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/inventory.css"/>

<!-- iOS Safe Area -->
<style>
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .container {
    padding-bottom: calc(env(safe-area-inset-bottom) + 96px);
  }

  /* ── أزرار التنقل الثابتة ── */
  .fab-nav {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 16px);
    z-index: 150;
    display: flex; align-items: center; gap: 6px;
    height: 46px; padding: 0 16px;
    background: rgba(20,14,8,0.92);
    color: #e8c070;
    border: 1.5px solid rgba(232,192,112,0.55);
    border-radius: 30px;
    font-family: inherit; font-size: 14px; font-weight: 700;
    box-shadow: 0 6px 22px rgba(0,0,0,0.55);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: opacity .2s, transform .15s;
  }
  .fab-nav:active { transform: scale(0.94); }
  #fab-back { right: 16px; }
  #fab-home { left: 16px; }
  .fab-nav.fab-off { opacity: 0.35; pointer-events: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">🧴</div>
    <h1>حاسبة العطور الاحترافية</h1>
    <div class="badge"><div class="badge-dot"></div>يعمل بالكامل بدون إنترنت</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('calc')">🧪 حاسبة</button>
    <button class="tab" onclick="showTab('blend')">🎨 مزج</button>
    <button class="tab" onclick="showTab('favs')">⭐ مفضلة</button>
    <button class="tab" onclick="showTab('inv')">📦 مخزون</button>
  </div>

  <div id="tab-calc"></div>
  <div id="tab-blend" style="display:none"></div>
  <div id="tab-favs" style="display:none"></div>
  <div id="tab-inv" style="display:none"></div>
</div>

<div id="modal"></div>
<div id="toast"></div>

<!-- أزرار التنقل الثابتة -->
<button id="fab-back" class="fab-nav fab-off" onclick="goBack()" aria-label="رجوع">→ رجوع</button>
<button id="fab-home" class="fab-nav" onclick="goHome()" aria-label="الرئيسية">🏠 الرئيسية</button>

<!-- Install Banner (iOS) -->
<div id="install-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1a1008,#2a1a08);border-top:1px solid rgba(232,192,112,0.4);padding:14px 18px;padding-bottom:calc(14px + env(safe-area-inset-bottom));z-index:9999;font-family:inherit">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-size:14px;font-weight:700;color:#e8c070">📲 ثبّت التطبيق</div>
      <div style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:3px">اضغط <strong style="color:#e8c070">□ ↑</strong> ثم "أضف إلى الشاشة الرئيسية"</div>
    </div>
    <button onclick="document.getElementById('install-banner').style.display='none'" style="background:rgba(232,192,112,0.15);border:1px solid rgba(232,192,112,0.3);color:#e8c070;border-radius:8px;padding:7px 13px;font-size:13px;cursor:pointer;font-family:inherit">فهمت ✓</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/inventory.js"></script>
<script>
// ── Navigation: Back / Home ──
function scrollTop0() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

function canGoBack() {
  const m = document.getElementById('modal');
  if (m && m.style.display === 'flex') return true;
  if (S.tab === 'calc') return S.step > 1;
  return true; // blend / favs → يرجع للحاسبة
}

function goBack() {
  const m = document.getElementById('modal');
  if (m && m.style.display === 'flex') { closeAdd(); return; }
  if (S.tab === 'calc') {
    if (S.step > 1) { setStep(S.step - 1); scrollTop0(); }
  } else if (S.tab === 'blend') {
    // تراجع خطوة: امسح آخر عطر تم اختياره، وإذا ما في شي ارجع للحاسبة
    if (S.bPerf3)      { S.bPerf3 = null; renderBlend(); }
    else if (S.bPerf2) { S.bPerf2 = null; renderBlend(); }
    else if (S.bPerf1) { S.bPerf1 = null; renderBlend(); }
    else               { showTab('calc'); }
    scrollTop0();
  } else if (S.tab === 'inv') {
    if (!INV.back()) showTab('calc');
    scrollTop0();
  } else {
    showTab('calc'); scrollTop0();
  }
  updateNav();
}

function goHome() {
  const m = document.getElementById('modal');
  if (m && m.style.display === 'flex') closeAdd();
  S.step = 1;
  showTab('calc');
  scrollTop0();
  updateNav();
}

function updateNav() {
  const b = document.getElementById('fab-back');
  if (b) b.classList.toggle('fab-off', !canGoBack());
}
setInterval(updateNav, 250);

// ── Service Worker Registration ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('✅ SW registered:', reg.scope))
      .catch(err => console.log('❌ SW error:', err));
  });
}

// ── iOS Install Banner ──
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
  || window.navigator.standalone;
const bannerDismissed = localStorage.getItem('install_banner_dismissed');

if (isIOS && !isStandalone && !bannerDismissed) {
  setTimeout(() => {
    document.getElementById('install-banner').style.display = 'block';
  }, 2500);
  document.getElementById('install-banner')
    .querySelector('button')
    .addEventListener('click', () => {
      localStorage.setItem('install_banner_dismissed', '1');
    });
}
</script>
</body>
</html>
